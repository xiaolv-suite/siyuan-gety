name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  # Required by `npm publish --provenance` to mint the Sigstore OIDC token.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Read pass-through so the npm step's `if:` can gate on it. Empty when
      # the repository secret is not configured, which keeps the step skipped.
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verify & Build
        run: deno task verify

      - name: Package connector
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          MANIFEST_VERSION="$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')"
          test "$VERSION" = "$MANIFEST_VERSION"
          PKG_NAME="siyuan-gety-${VERSION}"
          LEGACY_PKG_NAME="gety-siyuan-connector-${VERSION}"
          mkdir -p "release/${PKG_NAME}/dist"
          cp manifest.json "release/${PKG_NAME}/"
          cp dist/main.js "release/${PKG_NAME}/dist/"
          cp dist/main.js.map "release/${PKG_NAME}/dist/"
          cp icon.svg icon.png "release/${PKG_NAME}/"
          cp README.md LICENSE CHANGELOG.md "release/${PKG_NAME}/"
          cd release
          zip -r "${PKG_NAME}.zip" "${PKG_NAME}"
          sha256sum "${PKG_NAME}.zip" > "${PKG_NAME}.zip.sha256"
          cp "${PKG_NAME}.zip" "${LEGACY_PKG_NAME}.zip"
          sha256sum "${LEGACY_PKG_NAME}.zip" > "${LEGACY_PKG_NAME}.zip.sha256"
          cd ..
          echo "RELEASE_FILES=release/*.zip release/*.sha256" >> "$GITHUB_ENV"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*.zip
            release/*.sha256

      - name: Setup Node for npm publish
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      # Job-level `env` is readable from a step's `if`; a step's own `env` is
      # not, which silently skipped publishing before. The gate also skips a
      # version that is already on npm, since npm never allows republishing.
      - name: Publish to npm (skipped when NPM_TOKEN is unset)
        if: env.NPM_TOKEN != ''
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if npm view "siyuan-gety@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "siyuan-gety@${PKG_VERSION} is already on npm; skipping."
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
